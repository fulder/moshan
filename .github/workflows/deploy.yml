name: deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'samconfig.toml'
      - 'template.yml'
      - 'uv.lock'
      - 'pyproject.toml'

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@master
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          role-session-name: GitHubDeploySession

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Export requirements
        run: uv export --frozen --only-group lambda --no-hashes --output-file src/requirements.txt

      - name: build
        run: sam build --use-container

      - name: deploy
        run: |
          sam deploy --parameter-overrides \
            DomainName="moshan.fulder.dev" \
            TmdbToken=${{ secrets.TMDB_TOKEN }} \
            LocalCognitoClient=${{ secrets.LOCAL_COGNITO_CLIENT }} \
            TelegramBotToken=${{ secrets.TELEGRAM_BOT_TOKEN }} \
            TelegramChatId=${{ secrets.TELEGRAM_CHAT_ID }} \
            TelegramUsername=${{ secrets.TELEGRAM_USERNAME }} \
            AdminUsername=${{ secrets.TELEGRAM_USERNAME }} \
            AlarmEmail=${{ secrets.ALARM_EMAIL }}
