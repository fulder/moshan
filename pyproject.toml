[project]
name = "moshan"
version = "0.1.0"
description = ""
authors = [{ name = "fulder", email = "misad90@gmail.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"

[dependency-groups]
dev = [
    "boto3>=1.43.0,<2",
]
pytest = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-html>=4.2.0,<5",
    "pytest-mock>=3.16.0,<4",
]
lint = [
    "black>=26.10.0,<27",
    "isort>=9.0.2,<10",
    "flake8>=7.4.1,<8",
]
lambda = [
    "aws-lambda-powertools>=3.35.0,<4",
    "loguru>=0.7.3,<0.8",
    "pydantic>=2.13.5,<3",
    "pyjwt>=2.15.1,<3",
    "python-dateutil>=2.9.0,<3",
    "requests>=2.34.2,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--cov-report html --cov=src -vv"

[tool.isort]
profile = "black"

[tool.black]
line-length = 80
experimental-string-processing = true
