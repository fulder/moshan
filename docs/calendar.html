<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar - Moshan</title>
  <link rel="icon" type="image/png" href="/includes/icons/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
  <link rel="stylesheet" href="/includes/css/style.css">
  <script type="module" src="/includes/js/calendar.js"></script>
</head>
<body>
<header class="container" id="navbar"></header>

<main class="container">
  <div class="calendar-page">
  <h2>Calendar</h2>
  <p class="calendar-intro"><small>Your shows, new seasons and backlog movies, in your local time.</small></p>
  <ul class="legend">
    <li><span class="watched-mark">✓</span> Watched</li>
    <li><span class="unseen-mark">●</span> Unwatched</li>
    <li><span class="upcoming-mark">○</span> Upcoming</li>
    <li><span class="premiere">★</span> Premiere</li>
  </ul>
  <div id="calendar" aria-busy="true"></div>
  </div>
</main>

<footer class="container">
  <small>© Moshan</small>
</footer>
</body>
</html>
