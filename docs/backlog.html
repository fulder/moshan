<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backlog - Moshan</title>
  <link rel="icon" type="image/png" href="/includes/icons/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
  <link rel="stylesheet" href="/includes/css/style.css">
  <script type="module" src="/includes/js/backlog.js"></script>
</head>
<body>
<header class="container" id="navbar"></header>

<main class="container">
  <h2>Backlog <small id="itemCount" class="count"></small></h2>
  <div class="overflow-auto">
    <table class="striped compact-table">
      <thead>
        <tr>
          <th scope="col">Added</th>
          <th scope="col">Prio</th>
          <th scope="col" aria-label="Type"></th>
          <th scope="col">Title</th>
          <th scope="col">Status</th>
          <th scope="col">Release</th>
        </tr>
      </thead>
      <tbody id="backlog-table-body"></tbody>
    </table>
  </div>
</main>

<footer class="container">
  <small>© Moshan</small>
</footer>
</body>
</html>
