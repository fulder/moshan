<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moshan</title>
  <link rel="icon" type="image/png" href="/includes/icons/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
  <link rel="stylesheet" href="/includes/css/style.css">
  <script type="module" src="/includes/js/review.js"></script>
</head>
<body>
<header class="container" id="navbar"></header>

<main class="container">
  <p id="loading" aria-busy="true">Loading…</p>

  <article id="item" hidden>
    <div class="review-head">
      <img id="poster" alt="">
      <div>
        <nav id="episodeNav" hidden>
          <ul><li><a id="backLink" href="#">← All episodes</a></li></ul>
          <ul>
            <li><a id="previousButton" href="#" hidden>‹ Prev</a></li>
            <li><a id="nextButton" href="#" hidden>Next ›</a></li>
          </ul>
        </nav>
        <hgroup>
          <h2 id="title"></h2>
          <p id="meta"></p>
        </hgroup>
        <p id="link"></p>
        <p>
          <button id="addButton" hidden>Add</button>
          <button id="removeButton" class="danger" hidden>Remove</button>
        </p>
      </div>
    </div>

    <div class="grid">
      <label>Status
        <select id="user-status">
            <option value="">No status</option>
            <option value="finished">Finished</option>
            <option value="following">Following</option>
            <option value="watching">Watching</option>
            <option value="dropped">Dropped</option>
            <option value="backlog">Backlog</option>
        </select>
      </label>
      <label>Rating
        <select id="user-rating">
            <option value="">No rating</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
      </label>
    </div>

    <fieldset id="datesFieldset">
      <legend>Watched dates</legend>
      <div id="watched-dates"></div>
      <button id="newCalendarButton" type="button" class="secondary outline">+ Add date</button>
    </fieldset>

    <label>Overview
      <textarea id="overview" rows="2"></textarea>
    </label>
    <label>Review
      <textarea id="review" rows="4"></textarea>
    </label>

    <details id="synopsisDetails" hidden>
      <summary>Synopsis</summary>
      <div id="synopsis"></div>
    </details>

    <footer>
      <button id="saveButton">Save</button>
      <small>Watched <span id="watched_amount">0</span> times · Added <span id="user_added_date">–</span></small>
    </footer>
  </article>

  <section id="episodes" hidden>
    <h3>Episodes</h3>
    <div id="episodePages" class="pagination" hidden>
      <button id="episodePagePrev" class="secondary outline">‹</button>
      <select id="episodePageSelect" aria-label="Episode page"></select>
      <button id="episodePageNext" class="secondary outline">›</button>
    </div>
    <table id="episodesTable" class="striped">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Title</th>
          <th scope="col">Date</th>
        </tr>
      </thead>
      <tbody id="episodeTableBody"></tbody>
    </table>
  </section>
</main>

<footer class="container">
  <small>© Moshan</small>
</footer>
</body>
</html>
