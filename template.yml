AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  DomainName:
    Type: String

  HostedZoneId:
    Type: String
    Default: ThirdPartyZone

  TmdbToken:
    Type: String

  LocalCognitoClient:
    Type: String

  TelegramBotToken:
    Type: String
    Default: ""
    NoEcho: true

  TelegramChatId:
    Type: String
    Default: ""

  TelegramUsername:
    Type: String
    Default: ""
    Description: >-
      moshan username (as stored in the reviews table, e.g. m_fulder) whose
      shows trigger Telegram pings; not the Telegram name

  AdminUsername:
    Type: String
    Default: ""
    Description: >-
      moshan username that can also log watches for other accounts
      (watched together)

  AlarmEmail:
    Type: String
    Default: ""
    Description: Email that gets the update Lambda alarms (empty = no alarms)

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "api.${DomainName}"
      #      DomainValidationOptions:
      #        - DomainName: !Sub "api.${DomainName}"
      #          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AliasAttributes:
        - email
        - preferred_username
      # Personal app: accounts are created in the Cognito console, no sign-up
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 6
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  CognitoClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - !Sub "https://${DomainName}/callback.html"
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      LogoutURLs:
        - !Sub "https://${DomainName}/index.html"
      UserPoolId: !Ref CognitoUserPool

  CognitoDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Join [ "-", !Split [ ".", !Ref DomainName ] ]
      UserPoolId: !Ref CognitoUserPool

  Gateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          cognito:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.eu-west-1.amazonaws.com/${CognitoUserPool}"
              audience:
                - !Ref CognitoClient
                - !Ref LocalCognitoClient
        DefaultAuthorizer: cognito
      # Far above one person's use; caps what a script could cost
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20
      CorsConfiguration:
        AllowHeaders:
          - "authorization"
          - "content-type"
        AllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
        AllowOrigins:
          - !Sub "https://${DomainName}"
          - "http://localhost:8080"
      DisableExecuteApiEndpoint: true
      Domain:
        CertificateArn: !Ref Certificate
        DomainName: !Sub "api.${DomainName}"
        EndpointConfiguration: REGIONAL
        Route53:
          HostedZoneId: !Ref HostedZoneId
        SecurityPolicy: TLS_1_2

  DatabasePolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: review_database
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:UpdateItem
              - dynamodb:PutItem
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/reviews"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/reviews/index/*"
      Roles:
        - !Ref ApiFunctionRole
        - !Ref UpdatesPubFunctionRole
        - !Ref UpdatesSubFunctionRole

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # GET /users: the accounts that can be viewed
        - PolicyName: cognito_list_users
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                Resource:
                  - !GetAtt CognitoUserPool.Arn

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: app.handler
      Environment:
        Variables:
          REVIEWS_DATABASE_NAME: reviews
          LOG_LEVEL: INFO
          TMDB_TOKEN: !Ref TmdbToken
          USER_POOL_ID: !Ref CognitoUserPool
          ADMIN_USERNAME: !Ref AdminUsername
      # /items is CPU-bound (botocore parsing ~1 MB pages); 2048 MB = full vCPU
      MemorySize: 2048
      Role: !GetAtt ApiFunctionRole.Arn
      Runtime: python3.13
      # A watch copied to another account repeats the Tenrai calls (0.55 s each)
      Timeout: 20
      Events:
        GetMethod:
          Type: HttpApi
          Properties:
            ApiId: !Ref Gateway
            Method: GET
            Path: "/{proxy+}"
        PostMethod:
          Type: HttpApi
          Properties:
            ApiId: !Ref Gateway
            Method: POST
            Path: "/{proxy+}"
        DeleteMethod:
          Type: HttpApi
          Properties:
            ApiId: !Ref Gateway
            Method: DELETE
            Path: "/{proxy+}"
        PutMethod:
          Type: HttpApi
          Properties:
            ApiId: !Ref Gateway
            Method: PUT
            Path: "/{proxy+}"

  ItemUpdatesTopic:
    Type: AWS::SNS::Topic

  UpdatesPubFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: sns
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref ItemUpdatesTopic
        # Finds anime still cached as airing (finale refresh)
        - PolicyName: reviews_scan
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/reviews"

  UpdatesPubFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: updates_publisher.handler
      Environment:
        Variables:
          REVIEWS_DATABASE_NAME: reviews
          LOG_LEVEL: INFO
          UPDATES_TOPIC_ARN: !Ref ItemUpdatesTopic
          TMDB_TOKEN: !Ref TmdbToken
      MemorySize: 2048
      Role: !GetAtt UpdatesPubFunctionRole.Arn
      Runtime: python3.13
      # First sequel check looks up ~300 relations at Tenrai's rate limit
      Timeout: 600
      Events:
        InvocationLevel:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  UpdatesSubFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  UpdatesSubFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: updates_subscriber.handler
      Environment:
        Variables:
          REVIEWS_DATABASE_NAME: reviews
          LOG_LEVEL: INFO
          TMDB_TOKEN: !Ref TmdbToken
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          TELEGRAM_USERNAME: !Ref TelegramUsername
      MemorySize: 1024
      Role: !GetAtt UpdatesSubFunctionRole.Arn
      Runtime: python3.13
      Timeout: 60
      Events:
        UpdatesSNS:
          Type: SNS
          Properties:
            Topic: !Ref ItemUpdatesTopic

  # Weekly Telegram list of shows with aired episodes not yet seen
  UnseenDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: unseen_digest.handler
      Environment:
        Variables:
          REVIEWS_DATABASE_NAME: reviews
          LOG_LEVEL: INFO
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          TELEGRAM_CHAT_ID: !Ref TelegramChatId
          TELEGRAM_USERNAME: !Ref TelegramUsername
      MemorySize: 1024
      Role: !GetAtt UpdatesSubFunctionRole.Arn
      Runtime: python3.13
      Timeout: 60
      Events:
        Weekly:
          Type: Schedule
          Properties:
            # Fridays 17:00 UTC
            Schedule: cron(0 17 ? * FRI *)

  # Alarms: email when the daily updates fail or stop running
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  UpdatesPubErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: Daily updates publisher failed or timed out
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UpdatesPubFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  UpdatesPubNotRunningAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: Daily updates publisher has not run for 2 days
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref UpdatesPubFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic

  UpdatesSubErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: Update worker failed on an item
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UpdatesSubFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
